name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests
      - run: PYTHONPATH=src python -m openapi_sentinel lint fixtures/offer-api.json
      - run: PYTHONPATH=src python -m openapi_sentinel diff fixtures/offer-api-v1.json fixtures/offer-api-v1.json
