[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-sentinel"
version = "0.1.0"
description = "Offline lint and breaking-change check for OpenAPI/Swagger descriptions, with telecom-style conventions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jihed Ben Arfa" }]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]

[project.scripts]
openapi-sentinel = "openapi_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
